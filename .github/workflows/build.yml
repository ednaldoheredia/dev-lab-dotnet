on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# ADICIONE ESSE BLOCO AQUI PARA LIBERAR A ACTION
permissions:
  contents: write
  pull-requests: write

jobs:
  versionamento:
    runs-on: ubuntu-latest
    name: Gerar Tag de Versão
    permissions:
      contents: write # Obrigatório para permitir que a action crie a tag
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.71.0 # Versão moderna e atualizada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true # Garante o prefixo 'v' (ex: v1.0.0)
          DEFAULT_BUMP: patch # Se não achar prefixo, aumenta o patch
          RELEASE_BRANCHES: master

  build:
    runs-on: ubuntu-latest
    name: Build Project
    needs: versionamento
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Test project
        run: dotnet test --no-build --verbosity normal

      - name: Test project1
        run: dotnet test --no-build --verbosity normal