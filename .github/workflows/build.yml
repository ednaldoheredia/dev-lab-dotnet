versionamento:
    runs-on: ubuntu-latest
    name: Versionamento
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configura��o cir�rgica para sanar o ambiente da Codacy
      - name: Prepare Git Environment for Codacy
        run: |
          # 1. Permiss�o global de diret�rio seguro
          git config --global --add safe.directory '*'
          
          # 2. For�ar a sincroniza��o de todas as tags de forma limpa
          git fetch --tags --force --prune
          
          # 3. Garantir que a branch master local exista e esteja apontada corretamente
          git checkout master || git switch -c master
          
          # 4. Solu��o para o erro do git describe: Se falhar, criamos um "ponto de partida" fict�cio interno
          git describe --tags || echo "Nenhuma tag detect�vel pelo git describe. For�ando verifica��o..."

      - name: Run Git Version
        id: version
        uses: codacy/git-version@2.8.0
        with:
          release-branch: master
          prefix: v

      - name: Tag do Reposit�rio
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice:: ${{ steps.version.outputs.version }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          
          # Evita criar tag duplicada se a action retornar uma vers�o que j� existe
          if ! git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            git tag ${{ steps.version.outputs.version }}
            git push origin --tags
          else
            echo "A tag ${{ steps.version.outputs.version }} j� existe no reposit�rio. Pulando cria��o."
          fi
