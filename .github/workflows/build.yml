on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# ADICIONE ESSE BLOCO AQUI PARA LIBERAR A ACTION
permissions:
  contents: write
  pull-requests: write

jobs:
  versionamento:
    runs-on: ubuntu-latest
    name: Versionamento
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Run Git Version
        uses: codacy/git-version@2.8.0
        with:
          release-branch: master
          prefix: v

  build:
    runs-on: ubuntu-latest
    name: Build Project
    needs: versionamento
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Test project
        run: dotnet test --no-build --verbosity normal

      - name: Test project1
        run: dotnet test --no-build --verbosity normal