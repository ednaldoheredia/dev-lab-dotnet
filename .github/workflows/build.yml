on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  versionamento:
    runs-on: ubuntu-latest
    name: Versionamento
    permissions:
      contents: write # Obrigatório para permitir que a action crie a tag
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CORREÇÃO AQUI: Garante o download das tags E define o diretório como seguro globalmente
      - name: Fix Git Permissions and Fetch tags
        run: |
          git config --global --add safe.directory '*'
          git fetch --tags --force

      - name: Run Git Version
        id: version
        uses: codacy/git-version@2.8.0
        with:
          release-branch: master
          prefix: v
          # lightweight-tags removido daqui pois era inválido

      - name: Tag do Repositório # Toda vez que gera o número de versão faço a TAG
        if: github.ref == 'refs/heads/master' # Executa somente se estiver no branch master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Autenticação do usuário que disparou
        run: |
          echo "::notice:: ${{ steps.version.outputs.version }}" # Manda uma notificação
          git config --global user.email "${{ github.actor }}@users.noreply.github.com" # Configura o e-mail de quem disparou
          git config --global user.name "${{ github.actor }}" # Configura o nome de quem disparou
          git tag ${{ steps.version.outputs.version }} # Tag leve (evita loops de commits)
          git push origin --tags

  build:
    runs-on: ubuntu-latest
    name: Build Project
    needs: versionamento
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Test project
        run: dotnet test --no-build --verbosity normal