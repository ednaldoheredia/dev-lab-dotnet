on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:

  versionamento:
    runs-on: ubuntu-latest
    name: Versionamento

    permissions:
      contents: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Git Permissions and Fetch tags
        run: |
          git config --global --add safe.directory '*'
          git fetch --tags --force

      - name: Run Git Version
        id: version
        uses: codacy/git-version@2.8.0
        with:
          release-branch: master
          prefix: v

      - name: Tag do Reposit�rio
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice:: ${{ steps.version.outputs.version }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          git tag ${{ steps.version.outputs.version }}
          git push origin --tags

  build:
    runs-on: ubuntu-latest
    name: Build Project
    needs: versionamento

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.0.x'
          cache: true
          cache-dependency-path: |
            Poc_01.sln

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Test project
        run: dotnet test --no-build --configuration Release --verbosity normal --logger trx --results-directory "TestResults"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  
  backend-lint:
    needs: versionamento
    runs-on: ubuntu-latest
    name: Backend Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          
          # o c�digo abaixo � necess�rio para eu pegar todo hist�rico de commits
          fetch-depth: 0

      - uses: github/super-linter@v6    #pegar o linter 
        env:
          DEFAULT_BRANCH: "master"        #pegar a master para valida��o 
          VALIDATE_ALL_CODEBASE: "false"
          VALIDATE_YAML: "true"         #pegar o linter para validar o yaml
          VALIDATE_CSHARP: "true"       #pegar o linter para validar o yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} #utilizando esse Token
    if: github.ref != 'refs/heads/master'  

  dependency-check:
    name: Dependency Check
    needs: versionamento
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write                        #Autorizando.
    steps:
      - uses: actions/checkout@v4                 #Fazendo checkout dos arquivos.

      - uses: actions/dependency-review-action@v4 #Baixando essa biblioteca do marcktplace para valida��o de componentes.
        with:
          comment-summary-in-pr: always
    if: github.ref != 'refs/heads/master'
  

  code-security-check:
    name: Code Security Check
    needs: versionamento           #Vai precisar do versionamento, needs � depend�ncia.
    runs-on: ubuntu-latest
    permissions:
      security-events: write       #Vai precisar de umas permiss�es a mais para escrita, para avisar de vulneabilidade
      packages: read               #Ler pacotes
      actions: read                #Ler actions
      contents: read              

    strategy:                      #Estrat�gia de Matri          
      matrix:                      #Cria uma estrat�gia em forma de matriz, ele gera combina��es ex: vers�es[10,12,14] as [ubuntu-latest, windows-lates], podemos dispara 
                                   #jobs ou passos utilizando a matriz    
        include:                   #incluindo parametros language e buil-mode.    
          - name: Backend
            language: csharp
            build-mode: autobuild   #Quando for a linguagem C# faz build

    steps:
      - uses: actions/checkout@v4                    #fazendo checkout

      - uses: github/codeql-action/init@v3           #essa action vai rodar por baixo dos panos para valida��o do c�digo, ele tem dois parametros initialize e actino
        name: Initialize CodeQL - ${{ matrix.name }} #essa action vai rodar por baixo dos panos para valida��o do c�digo
        with:
          languages: ${{ matrix.language }}          #pegando parametros da matrix da linha 229
          build-mode: ${{ matrix.build-mode }}       #pegando parametros da matrix da linha 229

      - uses: github/codeql-action/analyze@v3
        name: Analyze code - ${{ matrix.name }}
        with:
          category: "/language:${{ matrix.language }}"
    if: github.ref != 'refs/heads/master'
