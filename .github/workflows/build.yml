name: Build Project

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  versionamento:
    runs-on: ubuntu-latest
    name: Versionamento

    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Git Permissions and Fetch tags
        run: |
          git config --global --add safe.directory '*'
          git fetch --tags --force

      - name: Run Git Version
        id: version
        uses: codacy/git-version@2.8.0
        with:
          release-branch: master
          prefix: v

      - name: Tag do Repositório
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice:: ${{ steps.version.outputs.version }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
          git tag ${{ steps.version.outputs.version }}
          git push origin --tags

      - name: Create file versão
        if: github.ref == 'refs/heads/master'
        run: |
          echo ${{ steps.version.outputs.version }} > versao.txt

      - name: Upload Versao Artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: versao
          path: versao.txt

  build:
    runs-on: ubuntu-latest
    name: Build Project
    needs: versionamento

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.0.x'
          cache: true
          cache-dependency-path: |
            Poc_01.sln

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Test project
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger trx \
            --results-directory "TestResults"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

      - name: Publish Project
        run: |
          dotnet publish Poc_01.csproj \
            -c Release \
            -o ./publish \
            --no-build

      - name: Tag Published Version
        uses: restackio/update-json-file-action@2.1
        with:
          file: ./publish/appsettings.json
          fields: "{\"MY_APP_VERSION\": \"${{needs.versionamento.outputs.version}}\"}"

      - name: Upload Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./publish
  
  backend-lint:
    needs: versionamento
    runs-on: ubuntu-latest
    name: Backend Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          
          # o código abaixo é necessário para eu pegar todo histórico de commits
          fetch-depth: 0

      - uses: github/super-linter@v6    #pegar o linter 
        env:
          DEFAULT_BRANCH: "main"        #pegar a master para validação 
          VALIDATE_ALL_CODEBASE: "false"
          VALIDATE_YAML: "true"         #pegar o linter para validar o yaml
          VALIDATE_CSHARP: "true"       #pegar o linter para validar o yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} #utilizando esse Token
    if: github.ref != 'refs/heads/main'           

  code-security-check:
    name: Code Security Check
    needs: versionamento           #Vai precisar do versionamento, needs é dependência.
    runs-on: ubuntu-latest
    permissions:
      security-events: write       #Vai precisar de umas permissões a mais para escrita, para avisar de vulneabilidade
      packages: read               #Ler pacotes
      actions: read                #Ler actions
      contents: read              

    strategy:                      #Estratégia de Matri          
      matrix:                      #Cria uma estratégia em forma de matriz, ele gera combinações ex: versões[10,12,14] as [ubuntu-latest, windows-lates], podemos dispara 
                                   #jobs ou passos utilizando a matriz    
        include:                   #incluindo parametros language e buil-mode.    
          - name: Backend
            language: csharp
            build-mode: autobuild   #Quando for a linguagem C# faz build
         
    steps:
      - uses: actions/checkout@v4                    #fazendo checkout

      - uses: github/codeql-action/init@v3           #essa action vai rodar por baixo dos panos para validação do código, ele tem dois parametros initialize e actino
        name: Initialize CodeQL - ${{ matrix.name }} #essa action vai rodar por baixo dos panos para validação do código
        with:
          languages: ${{ matrix.language }}          #pegando parametros da matrix da linha 229
          build-mode: ${{ matrix.build-mode }}       #pegando parametros da matrix da linha 229

      - uses: github/codeql-action/analyze@v3
        name: Analyze code - ${{ matrix.name }}
        with:
          category: "/language:${{ matrix.language }}"
    if: github.ref != 'refs/heads/main'

  build-docker-image:
    name: Packing and Publish
    needs: [versionamento, build]
    runs-on: ubuntu-latest
    env:
      version: ${{ needs.versionamento.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: ./publish

      - name: Docker build Imagem
        run: | 
          docker build -t ${{ vars.DOCKERHUB_REPOSITORY }}:${{ env.version }} .

      - name: Tag Docker as Latest
        run: |
          docker tag ${{ vars.DOCKERHUB_REPOSITORY }}:${{ env.version }} ${{ vars.DOCKERHUB_REPOSITORY }}:latest
        if: github.ref != 'refs/heads/master'

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Docker Push
        run: |
          docker push --all-tags ${{vars.DOCKERHUB_REPOSITORY}}